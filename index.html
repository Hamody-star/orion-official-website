<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050711">
<meta name="description" content="اكتشف عالم ORION — عالمك كله في تطبيق واحد. A Connected Digital Universe.">
<title>ORION — اكتشف عالم ORION</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050711;color:#f3f6ff}
body{min-height:100svh;overflow-x:hidden}
.site-header{position:absolute;top:0;left:0;right:0;z-index:5;background:transparent;border:0;box-shadow:none}
.main-nav{display:none}
.header-actions{margin-inline-start:auto}
.landing{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:78px 18px 30px;position:relative}
.landing:before,.landing:after{display:none}
.landing-inner{width:100%;min-height:calc(100svh - 108px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.landing-emblem{display:block;width:min(88vw,78svh,760px);height:min(78svh,760px);max-height:calc(100svh - 190px);object-fit:contain;margin:0;opacity:1;animation:none;filter:none}
.landing-wordmark,.landing-sub,.landing-hook,.landing-contact,.landing-foot{display:none}
.landing-brand{font:800 clamp(34px,6vw,54px)/1 Manrope,sans-serif;letter-spacing:.22em;margin:0 0 2px;background:linear-gradient(110deg,#f8fbff 8%,#9ba8c7 38%,#fff4d6 58%,#b8c8ee 82%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 30px rgba(120,150,255,.16)}\n.landing-tag{font:600 clamp(20px,3.5vw,29px)/1.5 Cairo,sans-serif;color:#e7eaff;margin:0}\n.landing-description{max-width:620px;margin:0 auto;color:#aeb9d4;font:400 clamp(14px,2vw,17px)/1.9 Cairo,sans-serif}
.landing-sub{display:none}
.landing-cta{display:inline-flex;min-width:0;min-height:0;align-items:center;justify-content:center;font-family:Cairo,sans-serif;font-size:17px;padding:8px 4px;color:#f4f1ff;text-decoration:none;border-bottom:1px solid rgba(178,164,255,.55);background:transparent;box-shadow:none;transition:color .2s ease,border-color .2s ease}\n.landing-cta:hover{color:#b9a8ff;border-color:#b9a8ff}
.landing-cta span{margin-inline-start:8px}
.en-only{display:none}
body.english .ar-only{display:none}
body.english .en-only{display:initial}
body.english .landing-cta.en-only{display:inline-flex}
@media(max-width:600px){
 .site-header{padding:14px 18px}
 .landing{padding:68px 14px 24px}
 .landing-inner{min-height:calc(100svh - 92px);gap:22px}
 .landing-emblem{width:min(94vw,70svh);height:min(70svh,620px);max-height:calc(100svh - 185px)}
 .landing-tag{font-size:23px}
 .landing-cta{min-width:210px}
}
</style>
</head>
<body class="arabic">
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="site-header">
 <a class="brand" href="index.html" aria-label="ORION home"><img src="FE1CA2B2-797F-4EA6-8B1E-5C66DCC485C7.png" alt="ORION emblem"><span>ORION</span></a>
 <div class="header-actions"><button class="lang-switch" type="button" aria-label="Switch language">English</button></div>
</header>
<main>
<section class="landing" id="home">
 <div class="landing-inner">
  <img class="landing-emblem" src="FE1CA2B2-797F-4EA6-8B1E-5C66DCC485C7.png" alt="شعار ORION">
  <h1 class="landing-tag ar-only">اكتشف العوالم</h1>
  <h1 class="landing-tag en-only">Discover the Worlds</h1>
  <a class="button button-primary landing-cta ar-only" href="universe.html">اكتشف العوالم <span>↗</span></a>
  <a class="button button-primary landing-cta en-only" href="universe.html">Explore the Worlds <span>↗</span></a>
</div>
</section>
</main>
<script>
let lang="ar";const switcher=document.querySelector(".lang-switch");
switcher.addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.classList.toggle("english",lang==="en");document.body.classList.toggle("arabic",lang==="ar");switcher.textContent=lang==="ar"?"الإنجليزية":"العربية";document.querySelector(".landing-emblem").alt=lang==="ar"?"شعار ORION":"ORION emblem"});
</script>
</body></html>
