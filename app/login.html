<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050711"><title>تسجيل الدخول — ORION ID</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body data-page="login"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> ORION <small>ORION ID</small></a><div class="top-actions"><a class="text-link" href="signup.html" data-ar="إنشاء حساب" data-en="Create account">إنشاء حساب</a><button class="lang" type="button">English</button></div></header>
<main class="auth-shell"><section class="auth-card"><a class="back-link" href="index.html" data-ar="← العودة إلى ORION Web App" data-en="← Back to ORION Web App">← العودة إلى ORION Web App</a><div class="auth-symbol">✦</div><div class="eyebrow">ORION ID</div><h1 data-ar="أهلًا بعودتك" data-en="Welcome back">أهلًا بعودتك</h1><p class="muted" data-ar="سجّل الدخول للوصول إلى حسابك وعوالم ORION." data-en="Sign in to access your account and ORION worlds.">سجّل الدخول للوصول إلى حسابك وعوالم ORION.</p>
<form id="loginForm" novalidate><label for="loginIdentity" data-ar="البريد الإلكتروني أو اسم المستخدم أو الهاتف" data-en="Email, username or phone">البريد الإلكتروني أو اسم المستخدم أو الهاتف</label><input id="loginIdentity" name="identity" autocomplete="username" required placeholder="name@example.com"><label for="loginPassword" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><div class="password-wrap"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button class="show-pass" type="button" data-target="loginPassword" data-ar="إظهار" data-en="Show">إظهار</button></div><div class="form-row"><label class="check"><input type="checkbox" name="remember"><span data-ar="تذكرني على هذا الجهاز" data-en="Remember me on this device">تذكرني على هذا الجهاز</span></label><a class="text-link" href="#" id="forgotLink" data-ar="نسيت كلمة المرور؟" data-en="Forgot password?">نسيت كلمة المرور؟</a></div><button class="btn primary full" type="submit" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</button><p class="form-message" id="formMessage" role="status" aria-live="polite"></p></form><div class="auth-bottom"><span data-ar="ليس لديك حساب؟" data-en="Don't have an account?">ليس لديك حساب؟</span> <a href="signup.html" data-ar="أنشئ حسابًا" data-en="Create one">أنشئ حسابًا</a></div><p class="fineprint" data-ar="هذه واجهة أولية. لن يتم حفظ كلمة المرور أو إرسالها قبل ربط نظام المصادقة الآمن." data-en="This is an initial interface. Passwords are not stored or transmitted until secure authentication is connected.">هذه واجهة أولية. لن يتم حفظ كلمة المرور أو إرسالها قبل ربط نظام المصادقة الآمن.</p></section></main><script src="app.js"></script></body></html>
